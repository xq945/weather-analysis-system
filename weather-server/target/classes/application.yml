server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/weather_analysis?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: weather
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: weather-analysis-system-jwt-secret-key-2026
  expiration: 86400000

qweather:
  api-key: ${QWATHER_API_KEY}
  base-url: https://mb4ewug4a2.re.qweatherapi.com
